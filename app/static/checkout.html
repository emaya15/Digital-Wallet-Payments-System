<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Top-up (Razorpay Test)</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --ink:#1b2430; --muted:#6b7686; --line:#dde3ec; --brand:#2f6fed; --ok:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212b; --ink:#e8edf4; --muted:#9aa6b8; --line:#2c3543; --brand:#6e9bff; --ok:#4ade80; --bad:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:460px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.35rem; margin:8px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 16px; font-size:.9rem; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  h2 { font-size:1rem; margin:0 0 10px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); font:inherit; }
  button { margin-top:14px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--brand); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #log { white-space:pre-wrap; font:13px/1.5 ui-monospace, Consolas, monospace; margin:0; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .hint { font-size:.8rem; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>Wallet top-up</h1>
  <p class="sub">Razorpay <b>test mode</b>. Test card 4111 1111 1111 1111, any future expiry and CVV, or UPI success@razorpay.</p>

  <section>
    <h2>1. Log in</h2>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="asha@example.com">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn" type="button">Log in</button>
  </section>

  <section>
    <h2>2. Add money</h2>
    <label for="amount">Amount (₹10 to ₹50,000)</label>
    <input id="amount" type="number" min="10" max="50000" step="0.01" value="500">
    <button id="payBtn" type="button" disabled>Pay with Razorpay</button>
    <div class="hint" id="balance"></div>
  </section>

  <section>
    <h2>Log</h2>
    <pre id="log">Waiting…</pre>
  </section>
</main>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  let token = null;
  const $ = id => document.getElementById(id);

  function log(message, cls) {
    const line = document.createElement("span");
    if (cls) line.className = cls;
    line.textContent = message + "\n";
    const pre = $("log");
    if (pre.textContent === "Waiting…") pre.textContent = "";
    pre.appendChild(line);
  }

  async function api(path, options = {}) {
    const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
    if (token) headers["Authorization"] = "Bearer " + token;
    const response = await fetch(path, Object.assign({}, options, { headers }));
    let body = null;
    try { body = await response.json(); } catch (_) { /* empty body */ }
    if (!response.ok) {
      const detail = body && body.detail ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) : response.statusText;
      throw new Error(response.status + " " + detail);
    }
    return body;
  }

  async function showBalance() {
    const wallet = await api("/wallet");
    $("balance").textContent = "Current balance: ₹" + wallet.balance;
  }

  $("loginBtn").addEventListener("click", async () => {
    try {
      const data = await api("/auth/login", {
        method: "POST",
        body: JSON.stringify({ email: $("email").value.trim(), password: $("password").value })
      });
      token = data.access_token;
      $("payBtn").disabled = false;
      log("Logged in.", "ok");
      await showBalance();
    } catch (error) {
      log("Login failed: " + error.message, "bad");
    }
  });

  $("payBtn").addEventListener("click", async () => {
    $("payBtn").disabled = true;
    try {
      const order = await api("/wallet/razorpay-order", {
        method: "POST",
        body: JSON.stringify({ amount: String($("amount").value) })
      });
      log("Order created: " + order.razorpay_order_id);

      const checkout = new Razorpay({
        key: order.key_id,
        order_id: order.razorpay_order_id,
        amount: order.amount_paise,
        currency: order.currency,
        name: "Digital Wallet",
        description: "Wallet top-up",
        handler: async (response) => {
          log("Payment done: " + response.razorpay_payment_id);
          try {
            const result = await api("/wallet/razorpay-confirm", {
              method: "POST",
              headers: { "Idempotency-Key": crypto.randomUUID() },
              body: JSON.stringify({
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature
              })
            });
            log(result.credited ? "Wallet credited." : "Already credited earlier (no double credit).", "ok");
            await showBalance();
          } catch (error) {
            log("Confirm failed: " + error.message, "bad");
          } finally {
            $("payBtn").disabled = false;
          }
        },
        modal: { ondismiss: () => { log("Checkout closed without paying."); $("payBtn").disabled = false; } }
      });
      checkout.on("payment.failed", (event) => {
        log("Payment failed: " + (event.error && event.error.description), "bad");
        $("payBtn").disabled = false;
      });
      checkout.open();
    } catch (error) {
      log("Could not start payment: " + error.message, "bad");
      $("payBtn").disabled = false;
    }
  });
</script>
</body>
</html>
